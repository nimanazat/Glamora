<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glamora – Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="app">

    <!-- Top search + cart -->
    <div class="top-bar">
      <div class="search-row">
        <div class="search-bar">
          <span class="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input id="home-search" type="text" placeholder="Search products" />
        </div>
        <button class="cart-btn" aria-label="Cart">
          <i class="fa-solid fa-bag-shopping"></i>
        </button>
      </div>
    </div>

    <main class="page-padding">

      <!-- Hero -->
      <div class="hero-card">
        <div class="hero-img">
          <img src="assets/logo/GlamoraGoldLogo.jpg" alt="Banner">
        </div>
        <div>
          <div class="hero-title">Glamora Erbil</div>
          <div class="hero-sub">15% Discount</div>
          <button class="hero-btn">Shop Now</button>
        </div>
      </div>

      <!-- Face Care Section -->
      <div class="section-title-row">
        <h2>Face Care Favourites</h2>
        <span>See all</span>
      </div>
      <div class="product-row" id="home-facecare"></div>
      <button class="see-all-btn" onclick="window.location.href='pages/facecare.html'">
        See All Face Care
      </button>

      <!-- Perfume Section -->
      <div class="section-title-row">
        <h2>Perfume</h2>
        <span onclick="window.location.href='pages/perfume.html'">See all</span>
      </div>
      <div class="product-row" id="home-perfume"></div>
      <button class="see-all-btn" onclick="window.location.href='pages/perfume.html'">
        See All Perfume
      </button>

      <!-- Body Care Section -->
      <div class="section-title-row">
        <h2>Body Care</h2>
        <span onclick="window.location.href='pages/bodycare.html'">See all</span>
      </div>
      <div class="product-row" id="home-bodycare"></div>
      <button class="see-all-btn" onclick="window.location.href='pages/bodycare.html'">
        See All Body Care
      </button>

      <!-- Hair Care Section -->
      <div class="section-title-row">
        <h2>Hair Care</h2>
        <span onclick="window.location.href='pages/haircare.html'">See all</span>
      </div>
      <div class="product-row" id="home-haircare"></div>
      <button class="see-all-btn" onclick="window.location.href='pages/haircare.html'">
        See All Hair Care
      </button>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a href="index.html" class="nav-item active">
          <span class="icon"><i class="fa-solid fa-house"></i></span>
          <span>Home</span>
        </a>
        <a href="categories.html" class="nav-item">
          <span class="icon"><i class="fa-solid fa-list"></i></span>
          <span>Categories</span>
        </a>
        <a href="favorites.html" class="nav-item">
          <span class="icon"><i class="fa-regular fa-heart"></i></span>
          <span>Favorites</span>
        </a>
        <a href="profile.html" class="nav-item">
          <span class="icon"><i class="fa-regular fa-user"></i></span>
          <span>Account</span>
        </a>
      </div>
    </nav>

  </div>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderProducts("#home-facecare", "facecare");
      renderProducts("#home-perfume", "perfume");
      renderProducts("#home-haircare", "haircare");
      renderProducts("#home-bodycare", "bodycare");
      enableSearch("#home-search", "#home-facecare");
    });
  </script>

</body>
</html>
